name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: go vet
        # Cross-compiled to match scripts/build.sh's actual GOOS/GOARCH
        # target (this plugin's main.go carries no build tag, so host
        # `go vet ./...` would cover the same files here -- kept
        # cross-compiled anyway for consistency with the other plugins in
        # this template, where a `//go:build wasip1` tag would otherwise
        # make host vet silently skip real code, ut-docs#166/#497 review).
        run: GOOS=wasip1 GOARCH=wasm go vet ./...
      - name: gofmt check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$fmt_out" >&2
            exit 1
          fi
      - name: Build WASI module
        run: scripts/build.sh
      - name: Validate manifest + plugin manifest
        run: scripts/validate.sh
      - name: Package (dry run)
        run: scripts/package.sh
